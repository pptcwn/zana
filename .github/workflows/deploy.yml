name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PGBOSS_DATABASE_URL: ${{ secrets.PGBOSS_DATABASE_URL }}
          TIKTOK_WEBHOOK_SECRET: ${{ secrets.TIKTOK_WEBHOOK_SECRET }}
          SHOPEE_WEBHOOK_SECRET: ${{ secrets.SHOPEE_WEBHOOK_SECRET }}
          FACEBOOK_WEBHOOK_SECRET: ${{ secrets.FACEBOOK_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_DEFAULT_CHAT_ID }}
          PLATFORM_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.PLATFORM_CREDENTIALS_ENCRYPTION_KEY }}

      - name: Build worker
        run: npm run build:worker

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PGBOSS_DATABASE_URL: ${{ secrets.PGBOSS_DATABASE_URL }}
          TIKTOK_WEBHOOK_SECRET: ${{ secrets.TIKTOK_WEBHOOK_SECRET }}
          SHOPEE_WEBHOOK_SECRET: ${{ secrets.SHOPEE_WEBHOOK_SECRET }}
          FACEBOOK_WEBHOOK_SECRET: ${{ secrets.FACEBOOK_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_DEFAULT_CHAT_ID }}
          PLATFORM_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.PLATFORM_CREDENTIALS_ENCRYPTION_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,PGBOSS_DATABASE_URL,TIKTOK_WEBHOOK_SECRET,SHOPEE_WEBHOOK_SECRET,FACEBOOK_WEBHOOK_SECRET,TELEGRAM_BOT_TOKEN,TELEGRAM_WEBHOOK_SECRET,TELEGRAM_DEFAULT_CHAT_ID,PLATFORM_CREDENTIALS_ENCRYPTION_KEY
          script: |
            cd /opt/zana
            git pull origin master
            printf "NEXT_PUBLIC_SUPABASE_URL=%s\n" "$SUPABASE_URL" > .env.production
            printf "NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n" "$SUPABASE_ANON_KEY" >> .env.production
            printf "SUPABASE_SERVICE_ROLE_KEY=%s\n" "$SUPABASE_SERVICE_ROLE_KEY" >> .env.production
            printf "PGBOSS_DATABASE_URL=%s\n" "$PGBOSS_DATABASE_URL" >> .env.production
            printf "TIKTOK_WEBHOOK_SECRET=%s\n" "$TIKTOK_WEBHOOK_SECRET" >> .env.production
            printf "SHOPEE_WEBHOOK_SECRET=%s\n" "$SHOPEE_WEBHOOK_SECRET" >> .env.production
            printf "FACEBOOK_WEBHOOK_SECRET=%s\n" "$FACEBOOK_WEBHOOK_SECRET" >> .env.production
            printf "TELEGRAM_BOT_TOKEN=%s\n" "$TELEGRAM_BOT_TOKEN" >> .env.production
            printf "TELEGRAM_WEBHOOK_SECRET=%s\n" "$TELEGRAM_WEBHOOK_SECRET" >> .env.production
            printf "TELEGRAM_DEFAULT_CHAT_ID=%s\n" "$TELEGRAM_DEFAULT_CHAT_ID" >> .env.production
            printf "PLATFORM_CREDENTIALS_ENCRYPTION_KEY=%s\n" "$PLATFORM_CREDENTIALS_ENCRYPTION_KEY" >> .env.production
            docker compose --env-file .env.production -f docker-compose.yml up -d --build
